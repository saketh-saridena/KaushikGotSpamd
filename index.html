<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>#KaushikGotSpam'd</title>
  <meta name="description" content="You're invited. Tap to open the invitation and RSVP.">
  <meta property="og:title" content="#KaushikGotSpam'd">
  <meta property="og:description" content="You're invited. Tap to open the invitation and RSVP.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#4a0d19">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c7341d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f1e9d2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Jost:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="gate.css">
</head>
<body>
  <main class="gate">
    <section class="card" aria-labelledby="title">
      <span class="seal" aria-hidden="true">S<i>&amp;</i>K</span>
      <h1 id="title">#KaushikGotSpam'd</h1>

      <form id="signin" novalidate hidden>
        <p class="lead">Hosts only. Please sign in.</p>
        <label>Email
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" id="signinBtn" type="submit">Sign in</button>
      </form>

      <div id="home" hidden>
        <p class="lead">Where would you like to go?</p>
        <div class="choices">
          <button class="choice" id="openInvitation" type="button">Invitation</button>
          <button class="choice" id="openDashboard" type="button">Dashboard</button>
        </div>
        <p class="who" id="who"></p>
        <button class="quiet" id="signout" type="button">Sign out</button>
      </div>

      <p class="message" id="message" role="alert"></p>
    </section>
  </main>
  <script src="gate.js"></script>
</body>
</html>
